[pytest]
testpaths = tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow running (>30s), deselect with '-m "not slow"'
    quantum: marks tests that run the quantum VQC circuit (always slow)
    classical: marks tests that train the classical MLP
    gpu: marks tests that require a CUDA-capable GPU
addopts = -v --tb=short
